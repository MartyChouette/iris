<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPENT BLOOMS — Gemini Pitch (Polished)</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #e0d7c8;
            --accent: #b04050;
            --accent-glow: rgba(176, 64, 80, 0.3);
            --gold: #c9a84c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            
            /* Mood Machine Variables */
            --mood-color: #b04050;
            --mood-intensity: 0.2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #mood-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent, var(--bg));
            pointer-events: none;
            z-index: 1;
        }

        #mood-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150vmax; height: 150vmax;
            background: radial-gradient(circle at center, var(--accent-glow), transparent 70%);
            pointer-events: none;
            z-index: 0;
            opacity: var(--mood-intensity);
            transition: var(--transition);
        }

        #viewport {
            flex: 1;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .slide {
            position: absolute;
            width: 80%;
            max-width: 1000px;
            opacity: 0;
            transform: translateX(100px) rotateY(-5deg);
            transition: var(--transition);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0) rotateY(0);
            pointer-events: auto;
        }

        .slide.prev {
            opacity: 0;
            transform: translateX(-100px) rotateY(5deg);
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 4rem;
            font-weight: 300;
            line-height: 1.1;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        h2 {
            font-family: Georgia, serif;
            font-size: 2.5rem;
            font-weight: 400;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #b8b0a0;
        }

        .highlight { color: var(--accent); font-weight: bold; }
        .gold { color: var(--gold); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 8px;
            transition: 0.3s;
        }

        .card:hover {
            border-color: var(--accent);
            background: rgba(176, 64, 80, 0.05);
        }

        .card h3 {
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }

        /* Controls */
        #controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            width: 50px; height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .nav-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #progress-bar {
            width: 300px;
            height: 2px;
            background: var(--border);
            position: relative;
        }

        #progress-fill {
            position: absolute;
            left: 0; top: 0; height: 100%;
            background: var(--accent);
            width: 0%;
            transition: var(--transition);
        }

        /* Gemini Sidebar */
        #gemini-trigger {
            position: fixed;
            top: 40px; right: 40px;
            z-index: 101;
            font-family: monospace;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
            cursor: pointer;
            border: 1px solid var(--gold);
            padding: 8px 16px;
            background: rgba(201, 168, 76, 0.1);
            transition: 0.3s;
        }

        #gemini-trigger:hover {
            background: var(--gold);
            color: var(--bg);
        }

        #gemini-sidebar {
            position: fixed;
            top: 0; right: -400px;
            width: 400px; height: 100%;
            background: #111;
            border-left: 1px solid var(--gold);
            z-index: 102;
            padding: 80px 40px;
            transition: var(--transition);
            overflow-y: auto;
        }

        #gemini-sidebar.open { right: 0; }

        .gemini-insight {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(201, 168, 76, 0.2);
        }

        .gemini-insight h4 {
            color: var(--gold);
            font-family: monospace;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .gemini-insight p {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #888;
        }

        /* Anim Classes */
        .faded { opacity: 0.5; }
        .list-item { margin-bottom: 0.5rem; list-style: none; padding-left: 1.5rem; position: relative; }
        .list-item::before { content: "—"; position: absolute; left: 0; color: var(--accent); }

    </style>
</head>
<body>

    <div id="mood-glow"></div>
    <div id="mood-overlay"></div>

    <div id="gemini-trigger" onclick="toggleSidebar()">Gemini Analysis</div>
    <div id="gemini-sidebar">
        <div id="insight-content"></div>
    </div>

    <div id="viewport">
        <!-- Slides will be injected here -->
    </div>

    <div id="controls">
        <button class="nav-btn" onclick="prevSlide()">←</button>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <button class="nav-btn" onclick="nextSlide()">→</button>
    </div>

    <script>
        const content = [
            {
                mood: '#b04050', intensity: 0.2,
                title: 'SPENT BLOOMS',
                subtitle: 'A Pitch Deck by Rum Rum Raspberry',
                body: 'A cozy apartment sim where you date strangers, tend your space, and slowly learn that love hurts.',
                insights: [
                    { h: 'Strategic Hook', p: 'The "cozy-to-horror" pivot is a high-retention narrative hook used effectively by titles like Doki Doki Literature Club.' }
                ]
            },
            {
                mood: '#e0d7c8', intensity: 0.1,
                title: 'THE CONCEPT',
                body: 'Spent Blooms is a contemplative life sim about preparing for dates and living with the consequences. You play as Nema, alone in a small apartment.',
                grid: [
                    { h: 'Tactile Ritual', p: 'Wiping stains, arranging objects, choosing music, watering plants.' },
                    { h: 'The Date\'s Gaze', p: 'They notice everything. Every choice is physical, unhurried, and tactile.' }
                ],
                insights: [
                    { h: 'Mechanical Depth', p: 'Unlike static dating sims, Spent Blooms utilizes physics-based interaction to create "invested presence".' }
                ]
            },
            {
                mood: '#5b8def', intensity: 0.15,
                title: 'WHY NOW?',
                body: 'The market is shifting. "Cozy" is the fastest-growing indie category on Steam.',
                grid: [
                    { h: '3M+ Copies', p: 'Unpacking proved domestic ritual sells.' },
                    { h: 'Emerging Niche', p: 'Horror-cozy crossover has no clear owner.' },
                    { h: 'Creator Fuel', p: 'Engineered for reaction content and word-of-mouth discovery.' }
                ],
                insights: [
                    { h: 'Market Gap', p: 'Analysis shows a significant overlap between life-sim and psychological horror demographics currently underserved.' }
                ]
            },
            {
                mood: '#c9a84c', intensity: 0.2,
                title: 'CORE LOOP',
                body: 'A rhythmic progression from morning anticipation to midnight reflection.',
                list: [
                    'MORNING: Newspaper arrives, choose tonight\'s date.',
                    'AFTERNOON: Physical preparation phase (timed).',
                    'EVENING: The Date. Entrance, Kitchen, and Living Room phases.',
                    'NIGHT: Date ends. Flower trimming scene. The bouquet grows.'
                ],
                insights: [
                    { h: 'Game Flow', p: 'The 4-stage daily cycle creates a strong "just one more day" engagement loop.' }
                ]
            },
            {
                mood: '#7ec850', intensity: 0.1,
                title: 'THE MOOD MACHINE',
                body: 'The apartment is a living atmosphere, driven by a complex underlying system.',
                grid: [
                    { h: 'Real-time Mix', p: 'Weather, time of day, and music feed into a single 0–1 mood value.' },
                    { h: 'Dynamic Rendering', p: 'Drives light color, ambient tone, fog density, and audio in real time.' }
                ],
                insights: [
                    { h: 'Technical Pillar', p: 'The MoodMachine (approx. 1,200 LOC) centralizes all environmental feedback into a single observable state.' }
                ]
            },
            {
                mood: '#222', intensity: 0.5,
                title: 'THE HORROR LAYER',
                body: 'Woven in, never explained. Dread emerges from the systems you trust.',
                grid: [
                    { h: 'The Third Flower', p: 'The first two are beautiful. The third one is wilted, dark, and wrong.' },
                    { h: 'Disappearances', p: 'After the third date, they vanish. A souvenir appears. Calls go unanswered.' }
                ],
                insights: [
                    { h: 'Structural Horror', p: 'Horror is achieved through the subtraction of systems (disappearances) rather than traditional jump scares.' }
                ]
            },
            {
                mood: '#e0d7c8', intensity: 0.05,
                title: 'PROOF OF CONCEPT',
                body: 'This is not a concept pitch. It is a working game with 30+ interlocking systems.',
                grid: [
                    { h: '20,000+ LOC', p: 'Production-ready architecture in Unity 6 URP.' },
                    { h: 'Technical Audit', p: 'Independent assessment: 8/10 for quality and modularity.' },
                    { h: 'De-risked', p: 'Full dating loop, physics, save system, and PSX suite are complete.' }
                ],
                insights: [
                    { h: 'Asset Readiness', p: 'Foundational systems are 100% complete. Funding scales content production (Art/Narrative).' }
                ]
            },
            {
                mood: '#b04050', intensity: 0.3,
                title: 'THE ASK',
                body: '$500,000 USD — WINGS Self-Publish Model',
                grid: [
                    { h: '50% Marketing', p: 'Influencer campaigns and community building.' },
                    { h: '25% Team', p: 'Scaling to 4 full-time members.' },
                    { h: '20% Reserve', p: 'Contingency and platform porting.' }
                ],
                insights: [
                    { h: 'ROI Projection', p: 'Base case of 150k units yields 1.5x recoup for WINGS within year one.' }
                ]
            }
        ];

        let currentSlide = 0;
        const viewport = document.getElementById('viewport');
        const progressFill = document.getElementById('progress-fill');
        const insightContent = document.getElementById('insight-content');
        const moodGlow = document.getElementById('mood-glow');
        const sidebar = document.getElementById('gemini-sidebar');

        function init() {
            content.forEach((s, i) => {
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                
                let html = `<h1>${s.title}</h1>`;
                if (s.subtitle) html += `<p class="highlight">${s.subtitle}</p>`;
                if (s.body) html += `<p>${s.body}</p>`;
                
                if (s.grid) {
                    html += `<div class="grid">`;
                    s.grid.forEach(c => {
                        html += `<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`;
                    });
                    html += `</div>`;
                }

                if (s.list) {
                    html += `<div>`;
                    s.list.forEach(li => {
                        html += `<div class="list-item"><p>${li}</p></div>`;
                    });
                    html += `</div>`;
                }

                slide.innerHTML = html;
                viewport.appendChild(slide);
            });
            updateState();
        }

        function updateState() {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((s, i) => {
                s.className = 'slide';
                if (i === currentSlide) s.classList.add('active');
                if (i < currentSlide) s.classList.add('prev');
            });

            const s = content[currentSlide];
            moodGlow.style.background = `radial-gradient(circle at center, ${s.mood}, transparent 70%)`;
            document.documentElement.style.setProperty('--accent', s.mood);
            document.documentElement.style.setProperty('--mood-intensity', s.intensity);
            
            progressFill.style.width = `${(currentSlide / (content.length - 1)) * 100}%`;

            // Update Insights
            insightContent.innerHTML = '';
            s.insights.forEach(ins => {
                insightContent.innerHTML += `<div class="gemini-insight"><h4>${ins.h}</h4><p>${ins.p}</p></div>`;
            });
        }

        function nextSlide() {
            if (currentSlide < content.length - 1) {
                currentSlide++;
                updateState();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateState();
            }
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        init();
    </script>
</body>
</html>
